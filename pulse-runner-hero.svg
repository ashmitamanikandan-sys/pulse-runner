<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02030a"/>
      <stop offset="0.5" stop-color="#071329"/>
      <stop offset="1" stop-color="#18042b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73f7ff"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ff48ef"/>
    </linearGradient>
    <filter id="cyanGlow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#18d9ff" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="24" fill="none" stroke="#53efff" stroke-opacity=".55" stroke-width="3"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)"/>

  <!-- perspective floor -->
  <g opacity=".5">
    <path d="M600 240 L1100 420 M600 240 L100 420 M600 240 L600 420 M600 240 L850 420 M600 240 L350 420"
          stroke="#ff3bf7" stroke-width="2"/>
    <path d="M240 310H960 M180 350H1020 M110 392H1090"
          stroke="#27e7ff" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <!-- city silhouettes -->
  <g fill="#040711" stroke="#24dfff" stroke-opacity=".35">
    <rect x="55" y="170" width="90" height="160"/>
    <rect x="160" y="135" width="72" height="195"/>
    <rect x="250" y="195" width="105" height="135"/>
    <rect x="865" y="160" width="86" height="170"/>
    <rect x="968" y="115" width="74" height="215"/>
    <rect x="1058" y="185" width="95" height="145"/>
  </g>

  <!-- scan lines -->
  <g opacity=".17" stroke="#ffffff">
    <path d="M0 86H1200 M0 118H1200 M0 150H1200 M0 182H1200"/>
  </g>

  <text x="600" y="85" text-anchor="middle" fill="#73f7ff"
        font-family="monospace" font-size="21" letter-spacing="7">
    // CLASSIFIED NETWORK PROTOCOL //
  </text>

  <text x="600" y="180" text-anchor="middle" fill="url(#title)"
        font-family="Impact, Arial Black, sans-serif" font-size="88"
        font-style="italic" letter-spacing="7" filter="url(#cyanGlow)">
    PULSE
  </text>

  <text x="600" y="255" text-anchor="middle" fill="#ff48ef"
        font-family="Impact, Arial Black, sans-serif" font-size="76"
        font-style="italic" letter-spacing="8" filter="url(#pinkGlow)">
    RUNNER
  </text>

  <text x="600" y="300" text-anchor="middle" fill="#d9fbff"
        font-family="monospace" font-size="19" letter-spacing="4">
    NEON INFILTRATION // SIGNAL SURVIVAL // SYSTEM ESCALATION
  </text>

  <g font-family="monospace" font-size="16" letter-spacing="2">
    <text x="76" y="380" fill="#73f7ff">STATUS // ONLINE</text>
    <text x="600" y="380" text-anchor="middle" fill="#ffffff">BUILD → DODGE → SURVIVE</text>
    <text x="1124" y="380" text-anchor="end" fill="#ff69f4">SECTOR // ACTIVE</text>
  </g>
</svg>